apiVersion: v2
name: faros-infrastructure-provider
description: |
  faros provider that brokers application templates from a central kro
  (Kube Resource Orchestrator) cluster into faros tenant workspaces.
  Ships the provider Deployment, ClusterIP Service, the
  central-kro-cluster kubeconfig Secret (optional, dev convenience),
  and the CatalogEntry that registers the provider with the faros hub.
type: application
version: 0.1.0
appVersion: "0.1.0"
icon: https://example.com/kro-icon.png
keywords:
  - faros
  - kro
  - multicluster
  - templates
home: https://github.com/faroshq/faros
sources:
  - https://github.com/faroshq/faros/tree/main/providers/infrastructure
maintainers:
  - name: faros maintainers
